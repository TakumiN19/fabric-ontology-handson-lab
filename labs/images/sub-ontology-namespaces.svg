<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 490" width="1120" height="490" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans JP', sans-serif">
  <rect width="1120" height="490" fill="#FFFFFF"/>
  <rect x="16" y="16" width="1088" height="458" rx="8" fill="#FAFAFA" stroke="#E2E8F0" stroke-width="1"/>

  <text x="40" y="50" font-size="18" font-weight="600" fill="#0F172A">サブオントロジー（Namespace）による同名概念の分離と 5-Hop 波及経路</text>
  <text x="40" y="72" font-size="12" fill="#64748B">営業の「オーダー（erp#Order）」と製造現場の「オーダー/ワーク（mes#Order）」を衝突させずに接続し、設備・部材異常から顧客影響まで追跡する</text>
  <line x1="40" y1="86" x2="1080" y2="86" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Namespace 1: iot -->
  <rect x="40" y="106" width="260" height="344" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="40" y="106" width="260" height="32" rx="6" fill="#F1F5F9"/>
  <text x="54" y="127" font-size="12" font-weight="600" fill="#0F172A">Namespace: iot（設備監視・OT）</text>

  <rect x="58" y="158" width="224" height="84" rx="5" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2"/>
  <text x="70" y="178" font-size="12" font-weight="600" fill="#991B1B">iot#EquipmentAlert</text>
  <text x="70" y="196" font-size="10" fill="#7F1D1D">Synonym: 設備アラート / 警報 / 異常アラーム</text>
  <text x="70" y="213" font-size="10" fill="#0F172A">ALT-2026-901: ALT-VAC-LEAK (9.5 Pa, 28分)</text>
  <text x="70" y="229" font-size="10" fill="#0F172A">ALT-2026-902: ALT-TMP-HIGH (859.4 ℃, 24分)</text>

  <rect x="58" y="274" width="224" height="72" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="70" y="295" font-size="12" font-weight="600" fill="#334155">iot#Sensor (Graph非投影)</text>
  <text x="70" y="313" font-size="10" fill="#64748B">SNS-VBF-204 / SNS-CNC-101 ほか15台</text>
  <text x="70" y="330" font-size="10" fill="#64748B">高頻度360件は KQL / SQL で直接集計</text>

  <!-- Namespace 2: mes -->
  <rect x="348" y="106" width="364" height="344" rx="6" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <rect x="348" y="106" width="364" height="32" rx="6" fill="#EEF2FF"/>
  <text x="364" y="127" font-size="12" font-weight="600" fill="#312E81">Namespace: mes（製造実行・品質）</text>

  <rect x="366" y="156" width="156" height="86" rx="5" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.2"/>
  <text x="376" y="176" font-size="12" font-weight="600" fill="#0F172A">mes#Equipment</text>
  <text x="376" y="193" font-size="10" fill="#475569">Synonym: 設備 / 号機 / 炉</text>
  <text x="376" y="210" font-size="10" fill="#991B1B">EQ-VBF-204 (状態3=保全隔離)</text>
  <text x="376" y="226" font-size="10" fill="#991B1B">校正経過 109日 (&gt; 90日周期)</text>

  <rect x="366" y="264" width="156" height="86" rx="5" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.2"/>
  <text x="376" y="284" font-size="12" font-weight="600" fill="#0F172A">mes#MaterialLot</text>
  <text x="376" y="301" font-size="10" fill="#475569">Synonym: 磁石ロット / バッチ</text>
  <text x="376" y="318" font-size="10" fill="#991B1B">LOT-MAG-088 (182 ppm)</text>
  <text x="376" y="334" font-size="10" fill="#991B1B">上限 150 ppm 超過違反</text>

  <rect x="542" y="198" width="154" height="114" rx="5" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="552" y="218" font-size="12" font-weight="600" fill="#312E81">mes#Order</text>
  <text x="552" y="235" font-size="10" fill="#4338CA">キー: order_id (WO-*)</text>
  <text x="552" y="251" font-size="10" fill="#475569">Synonym: 製造指図 / ワーク</text>
  <text x="552" y="270" font-size="10" font-weight="600" fill="#991B1B">30=QualityHold:</text>
  <text x="552" y="285" font-size="10" fill="#0F172A">WO-1007 / 1012 / 1019</text>

  <rect x="542" y="334" width="154" height="94" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="552" y="354" font-size="12" font-weight="600" fill="#0F172A">mes#QualityInspection</text>
  <text x="552" y="372" font-size="10" fill="#475569">DEF-BOND-02 / DEF-TRQ-04</text>
  <text x="552" y="389" font-size="10" fill="#991B1B">3 = ScrapHold (赤札隔離)</text>
  <text x="552" y="406" font-size="10" fill="#64748B">INS-5007 / 5012 / 5019</text>

  <!-- Namespace 3: erp -->
  <rect x="760" y="106" width="320" height="344" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="760" y="106" width="320" height="32" rx="6" fill="#F1F5F9"/>
  <text x="776" y="127" font-size="12" font-weight="600" fill="#0F172A">Namespace: erp（受注・顧客・調達）</text>

  <rect x="778" y="156" width="284" height="106" rx="5" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="790" y="176" font-size="12" font-weight="600" fill="#312E81">erp#Order（mes#Order と同名概念を分離）</text>
  <text x="790" y="194" font-size="10" fill="#4338CA">キー: order_id (SO-*) / Synonym: 受注 / セールスオーダー</text>
  <text x="790" y="213" font-size="10" fill="#0F172A">・SO-2026-004 (4,800万円, status=3 AtRisk)</text>
  <text x="790" y="229" font-size="10" fill="#0F172A">・SO-2026-009 (3,250万円, status=3 AtRisk)</text>
  <text x="790" y="245" font-size="10" font-weight="600" fill="#DC2626">・SO-2026-015 (1,920万円, status=2 未更新の隠れリスク!)</text>

  <rect x="778" y="278" width="284" height="74" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="790" y="298" font-size="12" font-weight="600" fill="#0F172A">erp#Customer（Tier 1 戦略顧客 3社）</text>
  <text x="790" y="316" font-size="10" fill="#0F172A">CUS-001 / CUS-002 (8D: 48h) / CUS-003 (8D: 24h厳守)</text>
  <text x="790" y="334" font-size="10" font-weight="600" fill="#4F46E5">影響受注総額: 9,970万円 (&gt;=9,000万円 → COO決裁必須)</text>

  <rect x="778" y="366" width="284" height="68" rx="5" fill="#F0FDF4" stroke="#16A34A" stroke-width="1"/>
  <text x="790" y="386" font-size="12" font-weight="600" fill="#166534">erp#Supplier &amp; erp#Material</text>
  <text x="790" y="404" font-size="10" fill="#14532D">主: SUP-003 (品質78点・停止) → 代替認定先: SUP-007</text>
  <text x="790" y="420" font-size="10" fill="#14532D">MAT-MAG-04 backupSupplier 関係で即時探索</text>

  <!-- Edges -->
  <g stroke="#4F46E5" stroke-width="1.4" fill="none">
    <path d="M282 198 L366 198"/>
    <path d="M522 198 L542 232"/>
    <path d="M522 306 L542 276"/>
    <path d="M619 334 L619 312"/>
    <path d="M696 245 L778 210"/>
    <path d="M920 262 L920 278"/>
    <path d="M444 350 L444 400 L778 400"/>
  </g>
  <text x="737" y="200" font-size="9" font-weight="600" fill="#4F46E5" text-anchor="middle">fulfillsSalesOrder</text>
</svg>
